seed: 32
data:
  train: ./data/tss/TinyStoriesV2-GPT4-train.npy
  valid: ./data/tss/TinyStoriesV2-GPT4-valid.npy
  dtype: uint16
model:
  vocab_size: 10048
  context_length: 128
  d_model: 768
  num_layers: 12
  num_heads: 12
  d_ff: 3072
  rope_theta: 1e4
  device: npu
optimizer:
  type: adamw
  lr: 0.001
  betas: [0.9, 0.95]
  eps: 1e-8
  weight_decay: 0.1
train:
  batch_size: 4
  steps: 15
  lr_scheduler: wsd
  lr_max: 0.001
  lr_min: 1e-6
  t_w: 5
  t_c: 15
  grad_clip: 1.0
  accum_steps: 1
  checkpoint: false
  interval: 1
