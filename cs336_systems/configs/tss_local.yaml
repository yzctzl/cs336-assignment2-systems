seed: 32
data:
  train: ./data/TinyStoriesV2-GPT4-train.npy
  valid: ./data/TinyStoriesV2-GPT4-valid.npy
  dtype: uint16
model:
  vocab_size: 10000
  context_length: 128
  d_model: 768
  num_layers: 12
  num_heads: 12
  d_ff: 3072
  rope_theta: 1e4
  device: cuda
optimizer:
  type: muon
  muon_lr: 0.01167
  muon_momentum: 0.95
  lr: 0.0044
  betas: [0.9, 0.95]
  eps: 1e-8
  weight_decay: 0.1
train:
  batch_size: 4
  steps: 20
  lr_scheduler: wsd
  lr_max: 0.0044
  lr_min: 1e-6
  t_w: 2
  t_c: 18
  grad_clip: 1.0
  accum_steps: 1
  checkpoint: false
  interval: 1
